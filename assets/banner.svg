<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Orbs / Animated Elements in Background -->
  <g filter="url(#blurGlow)">
    <circle cx="150" cy="90" r="140" fill="#6366f1" opacity="0.35">
      <animate attributeName="cx" values="150;220;150" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;140;90" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="280" r="150" fill="#ec4899" opacity="0.3">
      <animate attributeName="cx" values="1050;980;1050" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="280;220;280" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="300" r="120" fill="#06b6d4" opacity="0.25">
      <animate attributeName="r" values="120;160;120" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Technical Grid overlay pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)"/>
  </g>

  <!-- Decorative Animated Network/Flow Graph Lines (Background Layer) -->
  <g opacity="0.35" stroke-dasharray="8 8">
    <path d="M 100 280 Q 300 120 600 200 T 1100 100" fill="none" stroke="url(#glowPurple)" stroke-width="2">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="15s" repeatCount="indefinite"/>
    </path>
    <path d="M 50 100 Q 400 320 800 140 T 1150 260" fill="none" stroke="url(#glowCyan)" stroke-width="2">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Background Decorative Glassmorphic Floating Badges -->
  <g filter="url(#dropShadow)" opacity="0.6">
    <!-- Floating Tech Pill 1 -->
    <rect x="80" y="45" width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="145" y="67" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ BACKSTAGE</text>
    
    <!-- Floating Tech Pill 2 -->
    <rect x="980" y="55" width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="1045" y="77" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 PORT & IDP</text>

    <!-- Floating Tech Pill 3 -->
    <rect x="1000" y="275" width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="1070" y="297" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 SCORECARDS</text>
  </g>

  <!-- Main Hero Card Backdrop (ensures title/subtitle readability in foreground) -->
  <rect x="150" y="75" width="900" height="210" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" filter="url(#dropShadow)"/>

  <!-- FOREGROUND TEXT & BRANDING (Stays crisp and non-hidden) -->
  <!-- Top Badge inside Card -->
  <rect x="475" y="100" width="250" height="28" rx="14" fill="url(#glowPurple)"/>
  <text x="600" y="119" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PLATFORM ENGINEERING 2026</text>

  <!-- Main Title -->
  <text x="600" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="#ffffff" letter-spacing="-0.5">
    Awesome Developer Portal Platform
  </text>
  
  <!-- Title Accent Underline -->
  <rect x="420" y="192" width="360" height="4" rx="2" fill="url(#glowPurple)"/>

  <!-- Subtitle -->
  <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="18" fill="#cbd5e1">
    Curated SaaS Platforms, Internal Developer Portals &amp; Open-Source Ecosystem
  </text>

  <!-- Tech Stack Pills under Subtitle -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <!-- Item 1 -->
    <text x="430" y="263" text-anchor="middle" fill="#38bdf8">🛠️ Service Catalogs</text>
    <circle cx="525" cy="258" r="3" fill="#64748b"/>
    <!-- Item 2 -->
    <text x="600" y="263" text-anchor="middle" fill="#a855f7">⚙️ Self-Service Scaffolding</text>
    <circle cx="695" cy="258" r="3" fill="#64748b"/>
    <!-- Item 3 -->
    <text x="770" y="263" text-anchor="middle" fill="#f472b6">📈 Developer Experience</text>
  </g>
</svg>
